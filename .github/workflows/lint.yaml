name: auto Linter


on:
  push:
    paths: "*.py"

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Linter
        run: pip install ruff

      - name: Check Linting
        run: ruff check .